# ContextFlow Cloud Run — DURABLE POC (Firestore memory).
#
# Project: contextflow-gagan-20261019 (Free Trial — GCP-only host)
# Region: us-central1 (Cloud Run + Firestore + Vertex)
#
# Authenticated only — do NOT deploy with --allow-unauthenticated.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: contextflow-durable
  labels:
    app: contextflow
    contextflow-tier: durable-poc
  annotations:
    contextflow.dev/demo-only: "false"
    contextflow.dev/memory-backend: firestore
    run.googleapis.com/invoker-iam-check: "true"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/cpu-throttling: "true"
      labels:
        app: contextflow
        contextflow-tier: durable-poc
    spec:
      serviceAccountName: contextflow-run@contextflow-gagan-20261019.iam.gserviceaccount.com
      containerConcurrency: 4
      timeoutSeconds: 180
      containers:
        - image: us-central1-docker.pkg.dev/contextflow-gagan-20261019/contextflow/contextflow-durable:ft7
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: CF_MODE
              value: split
            - name: CF_DEMO_ONLY
              value: "0"
            - name: CF_SMOKE_FIXTURE
              value: "0"
            - name: CF_MEMORY_BACKEND
              value: firestore
            - name: GCP_PROJECT
              value: contextflow-gagan-20261019
            - name: GCP_REGION
              value: us-central1
            - name: CF_FIRESTORE_DATABASE
              value: contextflow-poc
            - name: CF_VERTEX_LOCATION
              value: us-central1
            - name: CF_GEN_MODEL
              value: gemini-2.5-flash-lite
            - name: CF_LITE_MODEL
              value: gemini-2.5-flash-lite
            - name: CF_EMBED_LOCAL
              value: "1"
            - name: CF_DISC_EMBED
              value: "1"
            - name: CF_DISC_EMBED_W
              value: "0.35"
            - name: CF_CATALOG_BACKEND
              value: "firestore"
            - name: CF_CATALOG_LIMIT
              value: "5"
            - name: CF_USE_VERTEX
              value: "1"
            - name: CF_USE_GEMINI
              value: "0"
            - name: CF_LLM_EXTRACT
              value: "1"
            - name: CF_LLM_MODE
              value: vertex
            - name: CF_VERTEX_MIN_INTERVAL_S
              value: "6.5"
            # Seeds off for dynamic NEW path; set CF_SEED_E2E=1 only for seeded e2e harnesses.
            - name: CF_SEED_E2E
              value: "1"
          resources:
            limits:
              memory: 512Mi
              cpu: "1"
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 15
            failureThreshold: 3
